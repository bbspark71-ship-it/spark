<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" opacity="0.15">
  <defs>
    <!-- التدرجات اللونية -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1" />
    </linearGradient>
    
    <!-- نمط النقاط الهندسية -->
    <pattern id="dot-grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#64748b" opacity="0.3" />
    </pattern>
  </defs>

  <!-- خلفية النقاط -->
  <rect width="100%" height="100%" fill="url(#dot-grid)" />

  <!-- أشعة وموجات انسيابية -->
  <path d="M-100 200 C 300 50, 800 400, 1540 100 L 1540 0 L -100 0 Z" fill="url(#gold-grad)" />
  <path d="M-100 500 C 400 300, 900 700, 1540 450 L 1540 900 L -100 900 Z" fill="url(#emerald-grad)" />

  <!-- درع حماية عملاق مفرغ في الخلفية (أيقونة بصرية) -->
  <g transform="translate(1050, 220) scale(4)" opacity="0.12" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    <path d="m9 12 2 2 4-4"/>
  </g>
</svg>
